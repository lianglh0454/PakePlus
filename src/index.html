<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加班猫 · 桌面小助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { background: transparent !important; font-family: 'Microsoft YaHei', 'Segoe UI', system-ui, sans-serif; overflow: hidden; width: 100vw; height: 100vh; }

  .pet-wrapper {
    position: absolute; left: 50%; top: 58%; transform: translate(-50%, -50%);
    width: 200px; height: 200px; display: flex; justify-content: center; align-items: center;
    cursor: grab; overflow: visible;
  }
  .pet-wrapper:active { cursor: grabbing; }
  .cat-wrap { position: relative; transition: transform .15s ease; animation: float 3s ease-in-out infinite; overflow: visible; }
  .cat-wrap:active { transform: scale(0.94); }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .cat { width: 150px; height: 170px; display: block; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.4)); }

  .hover-info {
    position: absolute; top: 58px; left: 50%; transform: translateX(-50%) translateY(-100%) translateY(10px);
    background: rgba(20, 22, 28, 0.9); border: 1px solid rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px;
    display: flex; gap: 10px; font-size: 12px; font-weight: 700; color: #e8ecf5; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s; box-shadow: 0 8px 20px rgba(0,0,0,0.4); white-space: nowrap; z-index: 100;
  }
  .hover-info::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid rgba(20, 22, 28, 0.9); }
  .pet-wrapper:hover .hover-info { opacity: 1; transform: translateX(-50%) translateY(-100%) translateY(0); }
  .hi-item span { color: #ffd166; }
  .hi-item.mood span { color: #7ed6a5; }

  .bubble {
    position: absolute; top: 0px; left: 50%; transform: translateX(-50%) translateY(-100%) translateY(-10px);
    background: #fff; color: #333; padding: 8px 14px; border-radius: 14px; font-size: 12px; font-weight: 600; white-space: pre-line; text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none;
    border: 2px solid #ffd9a0; z-index: 110; max-width: 220px; width: max-content; 
  }
  .bubble.show { opacity: 1; transform: translateX(-50%) translateY(-100%) translateY(-5px); }
  .bubble::after { content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 6px solid #fff; }

  .context-menu {
    position: fixed; width: calc(100% - 16px); max-width: 250px;
    background: rgba(44, 48, 59, 0.98); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 8px;
    opacity: 0; pointer-events: none; transform: scale(0.95); transition: all .15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 9999; left: -9999px; top: -9999px;
  }
  .context-menu.show { opacity: 1; pointer-events: auto; transform: scale(1); }

  .cm-stats { display: flex; justify-content: space-between; font-size: 11px; color: #8b92a3; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; margin-bottom: 4px; }
  .cm-stats span b { color: #ffd9a0; font-size: 13px; display: block; text-align: center; margin-top: 2px; }
  .cm-stats span { text-align: center; flex: 1; }

  .cm-tabs { display: flex; background: rgba(0,0,0,0.2); border-radius: 6px; padding: 2px; }
  .tab-btn { flex: 1; padding: 4px 0; font-size: 11px; font-weight: 700; color: #8b92a3; background: transparent; border: none; border-radius: 4px; cursor: pointer; transition: all .2s; }
  .tab-btn.active { background: rgba(255,255,255,0.1); color: #e8ecf5; }
  
  .cm-panel { display: none; flex-direction: column; gap: 8px; }
  .cm-panel.active { display: flex; max-height: 240px; overflow-y: auto; padding-right: 2px; }
  .cm-panel::-webkit-scrollbar { width: 4px; }
  .cm-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .time-display {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: #ffd166; font-weight: bold;
    padding: 6px 10px; background: rgba(255,255,255,0.05); border-radius: 6px;
    letter-spacing: 1px; border: 1px solid rgba(255,209,102,0.2);
  }
  #btnRefreshTime { cursor: pointer; font-size: 14px; transition: transform 0.2s; padding: 0 4px; }
  #btnRefreshTime:active { transform: scale(0.8) rotate(180deg); }

  #focusDisplay {
    display: none; font-size: 13px; font-weight: bold; color: #ff9a6c;
    text-align: center; padding: 6px; background: rgba(255,122,92,0.1);
    border-radius: 6px; border: 1px dashed rgba(255,122,92,0.3);
  }

  .cm-status { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #c8cdd8; background: rgba(0,0,0,0.15); padding: 6px 8px; border-radius: 8px; }
  .cm-status b { color: #ffb347; }
  .ot-money-info { font-size: 11px; color: #ffd166; text-align: center; padding: 4px 0; background: rgba(255,209,102,0.1); border-radius: 6px; margin-bottom: 4px;}

  .btn { border: none; border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; transition: all .15s; color: #1a1c22; white-space: nowrap; text-align: center; }
  .btn:active { transform: scale(0.95); }
  .btn-clockin  { background: linear-gradient(135deg, #7ed6a5, #4ecca3); }
  .btn-clockout { background: linear-gradient(135deg, #ff9a6c, #ff7a5c); color: #fff; }
  .btn-focus    { background: #ffb347; }
  .btn-focus.active { background: #ff7a5c; color: white; }
  .btn-feed { background: #ffd166; }
  .btn-play { background: #b5a6ff; color: #fff; }
  .btn-game { background: #6cc3ff; color: #fff; }
  .btn-save { background: #4ecca3; color: #fff; margin-top: 4px; }
  .btn-export { background: #8b92a3; color: #fff; }
  .btn-import { background: #8b92a3; color: #fff; }
  .btn-view-log { background: #ffb347; color: #1a1c22; font-size: 11px; padding: 6px; margin-top: 4px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .cm-actions { display: flex; gap: 6px; }
  .cm-actions .btn { flex: 1; }

  .setting-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #c8cdd8; margin-bottom: 4px; gap: 4px;}
  .setting-row input, .setting-row select { padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; font-size: 11px; text-align: center; outline: none; }
  .setting-row input[type="number"] { width: 60px; }
  .setting-row input[type="time"] { width: 70px; }
  .setting-row input[type="text"] { flex: 1; text-align: left; }
  .setting-row input:focus { border-color: #ffd166; }
  
  .event-item { background: rgba(255,255,255,0.05); border-radius: 6px; padding: 8px; display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: #c8cdd8; }
  .event-header { display: flex; justify-content: space-between; font-weight: bold; }
  .event-header span:first-child { color: #ffd166; }
  .event-header span:last-child { color: #4ecca3; font-size: 10px; }
  .event-footer { display: flex; justify-content: space-between; align-items: center; color: #8b92a3; font-size: 10px; }
  .event-footer button { background: none; border: none; color: #ff7a5c; cursor: pointer; font-weight: bold;}

  .toast { position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #fff; padding: 4px 12px; border-radius: 12px; font-size: 12px; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; z-index: 130; }
  .toast.show { opacity: 1; }
  
  .heart { position: absolute; font-size: 18px; pointer-events: none; z-index: 120; animation: rise 1s ease-out forwards; }
  @keyframes rise { 0% { opacity: 1; transform: translateY(0) scale(0.6); } 100% { opacity: 0; transform: translateY(-50px) scale(1.2); } }

  /* ============ 游戏层 & 记录层 ============ */
  .game-overlay {
    position: fixed; inset: 0; z-index: 200; background: rgba(20,22,28,0.96);
    display: flex; flex-direction: column; opacity: 0; pointer-events: none; transition: opacity .2s; overflow: hidden;
  }
  .game-overlay.show { opacity: 1; pointer-events: auto; }
  .game-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-shrink: 0; }
  .game-head .title { font-size: 14px; font-weight: 700; color: #e8ecf5; flex: 1; }
  .close-x { width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer; background: rgba(255,255,255,0.08); color: #c8cdd8; font-size: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  
  #gameBody { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 10px; position: relative; overflow-y: auto; }
  #gameBody::-webkit-scrollbar, #logBody::-webkit-scrollbar { width: 4px; }
  #gameBody::-webkit-scrollbar-thumb, #logBody::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .game-menu-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
  .game-menu-head .title { font-size: 14px; font-weight: 700; color: #e8ecf5; flex: 1; }
  .menu-coins { font-size: 13px; color: #ffd166; font-weight: 700; }
  .game-cards { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; flex: 1; overflow-y: auto; }
  .game-card { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; cursor: pointer; font-family: inherit; text-align: left; transition: all .15s; position: relative; flex-shrink: 0; }
  .game-card.disabled { opacity: 0.45; }
  .gc-icon { font-size: 18px; }
  .gc-name { font-size: 13px; font-weight: 700; color: #e8ecf5; }
  .gc-desc { font-size: 10px; color: #8b92a3; }
  .game-card .cd { position: absolute; top: 10px; right: 12px; font-size: 10px; color: #ffb347; font-weight: 700; }

  .fish-top { width: 100%; display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .fish-bar-bg { flex: 1; min-width: 100px; height: 12px; background: rgba(255,255,255,0.08); border-radius: 6px; overflow: hidden; }
  #fishBar { height: 100%; width: 35%; border-radius: 6px; background: linear-gradient(90deg, #4ecca3, #7ed6a5); transition: width .08s linear; }
  .fish-lane { position: relative; width: 60px; height: 150px; margin: 8px auto; border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, #0b2f42 0%, #12506b 60%, #0e3d52 100%); border: 2px solid rgba(255,255,255,0.1); transition: border-color .15s; }
  .fish-lane.in-zone { border-color: #4ecca3; box-shadow: 0 0 15px rgba(78,204,163,0.4); }
  .fish-target { position: absolute; left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: 24px; will-change: top; z-index: 2; }
  .fish-hook { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 52px; height: 36px; border-radius: 10px; will-change: top; background: rgba(78, 204, 163, 0.4); border: 2px solid #7ed6a5; box-shadow: 0 0 10px rgba(78,204,163,0.5); z-index: 1; }
  .fish-hint { font-size: 11px; color: #8b92a3; margin-top: 4px; text-align: center; }
  .fish-hint b { color: #ffd166; }

  #coinArena { position: relative; width: 100%; height: 100%; min-height: 160px; border-radius: 12px; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, rgba(255,209,102,0.08), transparent 70%); }
  .coin-score { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 700; color: #ffd166; z-index: 2; }
  .falling-coin { position: absolute; font-size: 24px; cursor: pointer; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

  .rps-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
  .rps-cat { font-size: 40px; animation: float 2.4s ease-in-out infinite; }
  .rps-text { font-size: 12px; color: #c8cdd8; text-align: center; min-height: 18px; }
  .rps-btns { display: flex; gap: 6px; width: 100%; }
  .rps-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); cursor: pointer; font-family: inherit; transition: all .15s; }
  .rps-btn span { font-size: 22px; }
  .rps-btn small { font-size: 10px; color: #9aa0ad; }

  .result-mask { position: absolute; inset: 0; z-index: 250; background: rgba(10,12,16,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; }
  .result-card { background: #2c303b; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; width: 85%; }
  .result-card p { font-size: 14px; color: #e8ecf5; font-weight: 600; line-height: 1.4; white-space: pre-line; }

  /* ======== 记录列表与编辑样式 ======== */
  #logBody { flex:1; padding: 10px; overflow-y:auto; }
  .log-item { display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; color: #e8ecf5; }
  .log-header { display: flex; justify-content: space-between; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; margin-bottom: 4px; }
  .log-header span { color: #ffd166; }
  .log-body-row { display: flex; justify-content: space-between; align-items: center; color: #c8cdd8; }
  .log-actions { display: flex; gap: 6px; margin-top: 4px; }
  .log-btn { background: #4ecca3; color: #1a1c22; border: none; border-radius: 4px; padding: 4px 8px; font-size: 11px; cursor: pointer; font-weight: bold; }
  .log-btn.del { background: #ff7a5c; color: #fff; }
  .log-btn:active { transform: scale(0.95); }

  /* 编辑弹窗 */
  .edit-modal { position: absolute; inset: 0; z-index: 300; background: rgba(10,12,16,0.8); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; }
  .edit-modal.show { display: flex; }
  .edit-card { background: #2c303b; border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 20px; width: 240px; display: flex; flex-direction: column; gap: 12px; }
  .edit-card h3 { font-size: 14px; color: #e8ecf5; text-align: center; margin-bottom: 4px; }
  .edit-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #c8cdd8; }
  .edit-row input { width: 100px; padding: 4px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; outline: none; }
  .edit-btns { display: flex; gap: 8px; margin-top: 8px; }
  .edit-btns button { flex: 1; }
</style>
</head>
<body>

  <div class="pet-wrapper" id="petWrapper">
    <div class="cat-wrap" id="catWrap">
      <div class="hover-info" id="hoverInfo">
        <div class="hi-item">🍚 <span id="hoverHunger">100</span></div>
        <div class="hi-item mood">💖 <span id="hoverMood">100</span></div>
        <div class="hi-item">💰 <span id="hoverCoins">0</span></div>
      </div>
      <div class="bubble" id="bubble">喵～</div>

      <svg class="cat" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyGrad" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#FFFDF0" /><stop offset="70%" stop-color="#FCEBC9" /><stop offset="100%" stop-color="#F4D39C" />
          </radialGradient>
          <linearGradient id="earTip" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F4B886" /><stop offset="100%" stop-color="#E89B5B" />
          </linearGradient>
        </defs>
        <path d="M 55 160 Q 50 100 100 100 Q 150 100 145 160 Q 140 195 100 195 Q 60 195 55 160 Z" fill="url(#bodyGrad)" stroke="#E8C99B" stroke-width="1.5" />
        <g>
          <path d="M 60 115 L 48 75 L 85 100 Z" fill="#FFFDF0" stroke="#E8C99B" stroke-width="1.5" stroke-linejoin="round"/><path d="M 62 108 L 54 84 L 78 100 Z" fill="url(#earTip)" />
          <path d="M 140 115 L 152 75 L 115 100 Z" fill="#FFFDF0" stroke="#E8C99B" stroke-width="1.5" stroke-linejoin="round"/><path d="M 138 108 L 146 84 L 122 100 Z" fill="url(#earTip)" />
        </g>
        <g>
          <ellipse cx="40" cy="150" rx="16" ry="10" fill="#FFFDF0" stroke="#E8C99B" stroke-width="1.5" transform="rotate(-20 40 150)" /><ellipse cx="35" cy="150" rx="10" ry="6" fill="url(#earTip)" transform="rotate(-20 35 150)" />
          <ellipse cx="160" cy="150" rx="16" ry="10" fill="#FFFDF0" stroke="#E8C99B" stroke-width="1.5" transform="rotate(20 160 150)" /><ellipse cx="165" cy="150" rx="10" ry="6" fill="url(#earTip)" transform="rotate(20 165 150)" />
        </g>
        <g>
          <ellipse cx="78" cy="135" rx="4.5" ry="8" fill="#4A90E2" /><ellipse cx="122" cy="135" rx="4.5" ry="8" fill="#4A90E2" />
          <ellipse cx="77" cy="132" rx="1.5" ry="3" fill="#fff" /><ellipse cx="121" cy="132" rx="1.5" ry="3" fill="#fff" />
          <path d="M 95 148 L 100 153 L 105 148" stroke="#333" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M 100 153 L 100 158" stroke="#333" stroke-width="1.5" fill="none" stroke-linecap="round" />
          <line x1="60" y1="145" x2="40" y2="142" stroke="#666" stroke-width="1.5" stroke-linecap="round" /><line x1="60" y1="152" x2="40" y2="155" stroke="#666" stroke-width="1.5" stroke-linecap="round" />
          <line x1="140" y1="145" x2="160" y2="142" stroke="#666" stroke-width="1.5" stroke-linecap="round" /><line x1="140" y1="152" x2="160" y2="155" stroke="#666" stroke-width="1.5" stroke-linecap="round" />
        </g>
        <g transform="translate(100, 175)">
          <path d="M 0 0 L -15 -10 L -15 10 Z" fill="#2B2B33" stroke="#1a1a1f" stroke-width="1" stroke-linejoin="round" /><path d="M 0 0 L 15 -10 L 15 10 Z" fill="#2B2B33" stroke="#1a1a1f" stroke-width="1" stroke-linejoin="round" />
          <circle cx="0" cy="0" r="5" fill="#2B2B33" /><circle cx="0" cy="0" r="2.5" fill="#4A4A55" />
        </g>
      </svg>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="context-menu" id="contextMenu">
    <div class="cm-stats">
      <span>等级<b id="uiLevel">1</b></span>
      <span>经验<b id="uiExp">0/40</b></span>
      <span>今日专注<b id="uiFocusTotal">00:00</b></span>
      <span>今日加班<b id="uiOT">00:00</b></span>
    </div>
    
    <div class="cm-tabs">
      <button class="tab-btn active" data-tab="work">💼 工作</button>
      <button class="tab-btn" data-tab="fun">🎮 娱乐</button>
      <button class="tab-btn" data-tab="setting">⚙️ 设置</button>
      <button class="tab-btn" data-tab="calendar">📅 日历</button>
    </div>

    <!-- 工作面板 -->
    <div class="cm-panel active" id="panel-work">
      <div class="time-display">
        <span id="timeText">🕒 当前时间: --:--:--</span>
        <span id="btnRefreshTime" title="同步电脑时间">🔄</span>
      </div>
      <div class="ot-money-info">今日加班费：<b id="uiOTMoney">0</b> 元</div>
      
      <div id="focusDisplay">
        🍅 专注倒计时: <span id="focusLeft">25:00</span>
      </div>

      <div class="cm-status">
        <span id="uiStatus">还没打卡喵～</span>
        <button class="btn btn-clockin" id="btnClock">上班打卡</button>
      </div>
      <button class="btn btn-focus" id="btnFocus">🍅 开始专注 (25分)</button>
      <button class="btn btn-view-log" id="btnViewLog">📋 查看加班记录</button>
    </div>

    <!-- 娱乐面板 -->
    <div class="cm-panel" id="panel-fun">
      <div class="cm-actions">
        <button class="btn btn-feed" id="btnFeed">🍚 喂食 10</button>
        <button class="btn btn-play" id="btnPlay">🎾 陪玩 5</button>
      </div>
      <button class="btn btn-game" id="btnGame">🎮 玩游戏赚金币</button>
    </div>

    <!-- 设置面板 -->
    <div class="cm-panel" id="panel-setting">
      <div class="setting-row time-row">上班时间 <input type="time" id="setStart" value="08:30"></div>
      <div class="setting-row time-row">下班时间 <input type="time" id="setEnd" value="17:30"></div>
      <div class="setting-row">工作日时薪 <input type="number" id="setRateWd" value="50" min="0"></div>
      <div class="setting-row">周末时薪 <input type="number" id="setRateWe" value="100" min="0"></div>
      <div class="setting-row">专注时长 <input type="number" id="setFocus" value="25" min="1" max="120"></div>
      
      <div class="setting-row" style="margin-top: 8px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 8px;">

<script>
/* ===================== 存档配置 ===================== */
const SAVE_KEY = 'workcat_save_v15';
const defaultState = {
  level: 1, exp: 0, hunger: 100, mood: 100, coins: 0,
  lastTick: Date.now(), 
  clockInAt: null, 
  clockInType: null, 
  hasClockedOutToday: false, 
  todayOT: 0, todayOTMoney: 0, 
  todayFocus: 0,
  lastDate: new Date().toDateString(),
  waterAt: 0, sitAt: 0, focusEndAt: null, focusWarned: false, lastInteraction: Date.now(),
  workStart: '08:30', workEnd: '17:30', 
  otRateWeekday: 50, otRateWeekend: 100, focusDuration: 25,
  savePath: 'D:\\material\\other\\workcat_data.json', // 默认路径
  events: [], lastNotified: {},
  records: [] 
};
let S = loadSave();

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return { ...defaultState };
    const parsed = JSON.parse(raw);
    const merged = { ...defaultState, ...parsed };
    const today = new Date().toDateString();
    if (merged.lastDate !== today) {
      merged.todayOT = 0; merged.todayOTMoney = 0; merged.todayFocus = 0; merged.lastDate = today;
      merged.clockInAt = null; merged.clockInType = null; merged.hasClockedOutToday = false;
      merged._ot30 = false; merged._ot60 = false;
    }
    
    if (merged.events) {
      merged.events = merged.events.map(ev => {
        if (!ev.freq || ev.freq === 'once') {
          return { id: ev.id, name: ev.name, freq: 'anniversary', date: ev.date };
        }
        return ev;
      });
    }

    if (merged.records) {
      merged.records = merged.records.map(r => ({
        id: r.id || Date.now().toString() + Math.random().toString(36).substr(2, 5),
        date: r.date,
        type: r.type || 'overtime',
        clockInTime: r.clockInTime || '19:00',
        clockOutTime: r.clockOutTime || '20:00',
        otHours: r.otHours || 0,
        salary: r.salary || 0
      }));
    }
    
    return merged;
  } catch { return { ...defaultState }; }
}

function save() { 
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} 
  if (S.savePath && window.__TAURI__ && window.__TAURI__.fs) {
    window.__TAURI__.fs.writeTextFile(S.savePath, JSON.stringify(S, null, 2)).catch(() => {});
  }
}

/* ===================== 自动从文件导入 ===================== */
async function loadFromFile() {
  if (!S.savePath) return;
  if (!(window.__TAURI__ && window.__TAURI__.fs)) return; // 如果是浏览器环境直接跳过
  
  try {
    const content = await window.__TAURI__.fs.readTextFile(S.savePath);
    const parsed = JSON.parse(content);
    
    if (parsed.records && Array.isArray(parsed.records)) {
      const currentIds = new Set(S.records.map(r => r.id));
      let addedCount = 0;
      
      parsed.records.forEach(r => {
        if (!currentIds.has(r.id)) {
          S.records.push(r);
          addedCount++;
        }
      });
      
      if (addedCount > 0) {
        // 按日期重新排序
        S.records.sort((a, b) => new Date(a.date) - new Date(b.date));
        recalcTodayStats();
        save();
        showToast(`📂 已自动导入 ${addedCount} 条新记录`);
      }
    }
  } catch (err) {
    console.log("自动读取文件失败 (可能文件还不存在或路径错误):", err);
  }
}

/* ===================== DOM ===================== */
const $ = id => document.getElementById(id);
const petWrapper = $('petWrapper'), catWrap = $('catWrap'), bubble = $('bubble'), toast = $('toast');
const contextMenu = $('contextMenu');
const uiLevel = $('uiLevel'), uiExp = $('uiExp'), uiOT = $('uiOT'), uiFocusTotal = $('uiFocusTotal'), uiStatus = $('uiStatus'), uiOTMoney = $('uiOTMoney');
const hoverHunger = $('hoverHunger'), hoverMood = $('hoverMood'), hoverCoins = $('hoverCoins');
const btnClock = $('btnClock'), btnFocus = $('btnFocus'), btnFeed = $('btnFeed'), btnPlay = $('btnPlay'), btnGame = $('btnGame');
const gameMenuEl = $('gameMenu'), gamePlayEl = $('gamePlay'), gameBody = $('gameBody');
const gameTitle = $('gameTitle'), gameTimer = $('gameTimer');
const logOverlay = $('logOverlay'), logBody = $('logBody');
const editModal = $('editModal'), editIn = $('editIn'), editOut = $('editOut');

/* ===================== 工具 ===================== */
function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
let bubbleTimer = null;
function say(text, ms = 2200) {
  bubble.textContent = text; bubble.classList.add('show');
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
}
let toastTimer = null;
function showToast(text) {
  toast.textContent = text; toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}
function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'heart'; h.textContent = ['❤️', '💕', '💖', '✨'][Math.floor(Math.random() * 4)];
  const rect = catWrap.getBoundingClientRect();
  h.style.left = (rect.left + rect.width / 2 + (Math.random() - 0.5) * 50) + 'px';
  h.style.top = (rect.top + 40) + 'px'; document.body.appendChild(h);
  setTimeout(() => h.remove(), 1000);
}
function formatMin(min) {
  if (min < 0) return '00:00';
  const h = Math.floor(min / 60), m = min % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}
function expNeed(level) { return 40 + (level - 1) * 30; }
function addExp(n) {
  S.exp += n; let leveled = false;
  while (S.exp >= expNeed(S.level)) { S.exp -= expNeed(S.level); S.level++; leveled = true; }
  if (leveled) { showToast(`🎉 升级！Lv.${S.level}`); for (let i = 0; i < 6; i++) setTimeout(spawnHeart, i * 120); }
  save();
}

/* ===================== 独立时间更新 ===================== */
function updateClockDisplay() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const ss = String(now.getSeconds()).padStart(2, '0');
  const timeText = $('timeText');
  if (timeText) timeText.textContent = `🕒 当前时间: ${hh}:${mm}:${ss}`;
}
setInterval(updateClockDisplay, 1000);
updateClockDisplay();

$('btnRefreshTime').onclick = (e) => {
  e.stopPropagation();
  updateClockDisplay();
  showToast('时间已同步喵～');
};

/* ===================== 重新计算统计 ===================== */
function recalcTodayStats() {
  const todayStr = new Date().toISOString().slice(0, 10);
  let ot = 0, money = 0;
  S.records.forEach(r => {
    if (r.date === todayStr) {
      ot += Math.round(r.otHours * 60);
      money += r.salary;
    }
  });
  S.todayOT = ot;
  S.todayOTMoney = money;
}

/* ===================== 界面刷新 ===================== */
function refreshUI() {
  hoverHunger.textContent = Math.round(S.hunger);
  hoverMood.textContent = Math.round(S.mood);
  hoverCoins.textContent = S.coins;
  
  uiLevel.textContent = S.level;
  uiExp.textContent = `${S.exp}/${expNeed(S.level)}`;
  uiOT.textContent = formatMin(S.todayOT);
  uiOTMoney.textContent = S.todayOTMoney.toFixed(1);
  uiFocusTotal.textContent = formatMin(S.todayFocus);
  
  btnFeed.disabled = S.coins < 10;
  btnPlay.disabled = S.coins < 5;

  const now = new Date();
  const [eh, em] = S.workEnd.split(':').map(Number);
  const endToday = new Date(); endToday.setHours(eh, em, 0, 0);

  if (S.clockInAt) {
    const elapsed = Math.floor((Date.now() - S.clockInAt) / 60000);
    uiStatus.innerHTML = S.clockInType === 'overtime' ? `加班中 <b>${formatMin(elapsed)}</b>` : `已工作 <b>${formatMin(elapsed)}</b>`;
    btnClock.textContent = '下班打卡';
    btnClock.className = 'btn btn-clockout';
  } else {
    uiStatus.innerHTML = S.todayOT > 0 ? `今日加班 <b>${formatMin(S.todayOT)}</b>` : '还没打卡喵～';
    
    if (now >= endToday.getTime() + 10 * 60000) {
      btnClock.textContent = '加班打卡';
      btnClock.className = 'btn btn-feed'; 
    } else {
      btnClock.textContent = '上班打卡';
      btnClock.className = 'btn btn-clockin';
    }
  }

  const focusDisplay = $('focusDisplay');
  const focusLeftSpan = $('focusLeft');
  if (S.focusEndAt) {
    const leftMs = S.focusEndAt - Date.now();
    if (leftMs > 0) {
      const totalSec = Math.floor(leftMs / 1000);
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      focusLeftSpan.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      focusDisplay.style.display = 'block';
      
      btnFocus.textContent = '🛑 取消专注';
      btnFocus.classList.add('active');
    }
  } else {
    focusDisplay.style.display = 'none';
    btnFocus.textContent = `🍅 开始专注 (${S.focusDuration}分)`;
    btnFocus.classList.remove('active');
  }

  const menuCoins = $('menuCoins');
  if (menuCoins) menuCoins.textContent = S.coins;
}

/* ===================== 打卡逻辑 ===================== */
function processOvertime(mins, inTime, outTime, type) {
  const otHours = Math.floor((mins + 5) / 30) * 0.5;
  const today = new Date();
  const todayDate = new Date().toISOString().slice(0, 10);
  const isWeekend = [0, 6].includes(today.getDay());
  const rate = isWeekend ? S.otRateWeekend : S.otRateWeekday;
  const money = otHours * rate;

  S.records.push({
    id: Date.now().toString(),
    date: todayDate,
    type: type,
    clockInTime: inTime,
    clockOutTime: outTime,
    otHours: otHours,
    salary: money
  });

  if (otHours > 0) {
    S.todayOT += Math.round(otHours * 60);
    S.todayOTMoney += money;
    
    const expReward = Math.round(otHours * 15);
    const coinReward = Math.round(otHours * 15);
    addExp(expReward);
    S.coins += coinReward;
    
    say(`加班 ${otHours} 小时，赚了 ${money.toFixed(1)} 元💰\n经验+${expReward}，金币+${coinReward}`, 3500);
    showToast(`+${money.toFixed(1)} 元`);
  } else {
    say('加班不足25分钟，不计入喵～', 2500);
  }
}

async function handleClockClick() {
  const now = Date.now();
  const [eh, em] = S.workEnd.split(':').map(Number);
  const endToday = new Date(); endToday.setHours(eh, em, 0, 0);

  if (S.clockInAt) {
    const clockInTime = new Date(S.clockInAt).toTimeString().slice(0, 5);
    const clockOutTime = new Date(now).toTimeString().slice(0, 5);

    if (S.clockInType === 'normal') {
      if (now < endToday.getTime() - 10 * 60000) {
        S.clockInAt = null; S.clockInType = null;
        save(); refreshUI();
        say('还没到下班时间，已重置打卡喵～', 3000);
        showToast('误触已重置');
        return; 
      }
      
      S.hasClockedOutToday = true;
      S.clockInAt = null; S.clockInType = null;
      
      if (now > endToday.getTime()) {
        const ot_mins = Math.floor((now - endToday.getTime()) / 60000);
        processOvertime(ot_mins, clockInTime, clockOutTime, 'normal');
      } else {
        S.mood = clamp(S.mood + 15, 0, 100);
        say('准时下班！心情大好喵～', 3000);
        S.records.push({
          id: Date.now().toString(),
          date: new Date().toISOString().slice(0, 10),
          type: 'normal',
          clockInTime: clockInTime,
          clockOutTime: clockOutTime,
          otHours: 0,
          salary: 0
        });
        addExp(5);
        S.coins += 10;
      }
      
    } else {
      const ot_mins = Math.floor((now - S.clockInAt) / 60000);
      S.clockInAt = null; S.clockInType = null;
      S.hasClockedOutToday = true;
      processOvertime(ot_mins, clockInTime, clockOutTime, 'overtime');
    }
  } else {
    // 打卡前，先自动从本地文件读取同步一次记录
    await loadFromFile();

    if (now >= endToday.getTime() + 10 * 60000) {
      S.clockInAt = now; S.clockInType = 'overtime';
      S.hasClockedOutToday = true;
      say('加班打卡成功，辛苦喵！', 2500);
    } else {
      S.clockInAt = now; S.clockInType = 'normal';
      say('上班打卡成功喵！', 2500);
    }
    S.mood = clamp(S.mood + 5, 0, 100);
    for (let i = 0; i < 3; i++) setTimeout(spawnHeart, i * 150);
  }
  save(); refreshUI();
}

btnClock.onclick = (e) => { 
  e.stopPropagation(); 
  handleClockClick(); 
  contextMenu.classList.remove('show'); 
};

/* ===================== 沉浸专注逻辑 ===================== */
let focusTimer = null;

function toggleFocus() {
  if (S.focusEndAt) {
    S.focusEndAt = null; 
    clearInterval(focusTimer);
    S.mood = clamp(S.mood - 10, 0, 100);
    say('专注被打断了… 记得劳逸结合喵！', 3000);

  } else {
    const mins = S.focusDuration;

    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.cm-panel').forEach(p => p.classList.remove('active'));

    $('panel-work').classList.add('active');

    clearInterval(focusTimer);
    focusTimer = setInterval(() => {
      if (!S.focusEndAt) { clearInterval(focusTimer); return; }
      const left = S.focusEndAt - Date.now();
      if (left <= 0) {
        clearInterval(focusTimer);

        S.todayFocus += S.focusDuration;
        
        say('🍅 专注结束！休息一下吧喵～', 4000);

        for(let i=0; i<5; i++) setTimeout(spawnHeart, i*150);

  }

/* ===================== 日历倒计时计算 ===================== */
function getEventDesc(ev) {
  const now = new Date();
  const todayMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  
  if (ev.freq === 'anniversary') {
    const evDate = new Date(ev.date + 'T00:00:00');
    const diffMs = todayMidnight - evDate;
    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    return `已过去 ${days} 天`;
  }
  
  if (ev.freq === 'yearly') {
    let target = new Date(now.getFullYear(), ev.month - 1, ev.day);
    if (target < todayMidnight) target.setFullYear(target.getFullYear() + 1);
    const diffMs = target - todayMidnight;
    const days = Math.round(diffMs / (1000 * 60 * 60 * 24));
    return days === 0 ? '就是今天！' : `还有 ${days} 天`;
  }
  
  if (ev.freq === 'monthly') {
    let target = new Date(now.getFullYear(), now.getMonth(), ev.day);
    if (target.getMonth() !== now.getMonth()) target = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    if (target < todayMidnight) {
      target = new Date(now.getFullYear(), now.getMonth() + 1, ev.day);
      if (target.getMonth() !== (now.getMonth() + 1) % 12) target = new Date(now.getFullYear(), now.getMonth() + 2, 0);
    }
    const diffMs = target - todayMidnight;
    const days = Math.round(diffMs / (1000 * 60 * 60 * 24));
    return days === 0 ? '就是今天！' : `还有 ${days} 天`;
  }
  
  if (ev.freq === 'daily') {
    const [h, m] = ev.time.split(':').map(Number);
    let target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
    if (target < now) target.setDate(target.getDate() + 1);
    const diffMs = target - now;
    const hours = Math.floor(diffMs / (1000 * 60 * 60));
    const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    if (hours === 0 && mins === 0) return '马上就到了！';
    return `还有 ${hours}小时${mins}分`;
  }
  return '';
}

function getEventTypeStr(ev) {
  if (ev.freq === 'yearly') return `每年 ${ev.month}月${ev.day}日`;
  if (ev.freq === 'monthly') return `每月 ${ev.day}号`;
  if (ev.freq === 'daily') return `每天 ${ev.time}`;
  if (ev.freq === 'anniversary') return `纪念日 ${ev.date}`;
  return '';
}

/* ===================== 菜单与设置 ===================== */
let isDragging = false, startX = 0, startY = 0, lastPet = 0;

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.onclick = (e) => {
    e.stopPropagation();
    if (S.focusEndAt && btn.dataset.tab !== 'work') {
      showToast('专注中，请勿分心喵！');

$('btnSaveEdit').onclick = (e) => {
  e.stopPropagation();
  const record = S.records.find(x => x.id === editingRecordId);
  if (!record) return;
  
  const newIn = editIn.value;
  const newOut = editOut.value;
  if (!newIn || !newOut) { showToast('请填入完整时间'); return; }

  const [eh, em] = S.workEnd.split(':').map(Number);
  const [inh, inm] = newIn.split(':').map(Number);
  const [outh, outm] = newOut.split(':').map(Number);

  const inMin = inh * 60 + inm;
  const outMin = outh * 60 + outm;
  
  let otMins = 0;
  if (record.type === 'overtime') {
    otMins = outMin - inMin;
    if (otMins < 0) otMins += 24 * 60;
  } else {
    const endMin = eh * 60 + em;
    if (outMin > endMin) {
      otMins = outMin - endMin;
    } else {
      otMins = 0;
    }
  }

  const otHours = Math.floor((otMins + 5) / 30) * 0.5;
  const isWeekend = [0, 6].includes(new Date(record.date).getDay());
  const rate = isWeekend ? S.otRateWeekend : S.otRateWeekday;
  const money = otHours * rate;

  record.clockInTime = newIn;
  record.clockOutTime = newOut;
  record.otHours = otHours;
  record.salary = money;

  recalcTodayStats();
  save(); refreshUI(); renderLog();
  editModal.classList.remove('show');
  showToast('记录已更新，同步至文件');
};

/* ===================== 主循环与事件提醒 ===================== */
function checkEvents() {
  const today = new Date();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const todayStr = `${today.getFullYear()}-${mm}-${dd}`;
  const currentTime = String(today.getHours()).padStart(2, '0') + ':' + String(today.getMinutes()).padStart(2, '0');

  S.events.forEach(ev => {
    if (S.lastNotified[ev.id] === todayStr) return;

    let trigger = false;

    if (ev.freq === 'anniversary' && ev.date === todayStr) {
      trigger = true;
    } else if (ev.freq === 'yearly') {
      if (parseInt(mm) === ev.month && parseInt(dd) === ev.day) trigger = true;
    } else if (ev.freq === 'monthly') {
      if (parseInt(dd) === ev.day) trigger = true;
    } else if (ev.freq === 'daily') {
      if (ev.time === currentTime) trigger = true;
    }

    if (trigger) {
      say(`📅 提醒：今天是 ${ev.name} 喵！`, 5000);
      showToast(`日历提醒：${ev.name}`);
      S.lastNotified[ev.id] = todayStr;
    }
  });
  save();
}

function tick() {
  const now = Date.now();
  const dt = Math.min(now - S.lastTick, 3600000); S.lastTick = now;
  if (dt > 0) {
    S.hunger = clamp(S.hunger - (dt / 600000) * 1, 0, 100);
    let moodDrain = dt / 900000;
    if (S.hunger < 20) moodDrain *= 2;
    S.mood = clamp(S.mood - moodDrain, 0, 100);
  }
  const today = new Date().toDateString();
  if (S.lastDate !== today) { 
    S.lastDate = today; S.todayOT = 0; S.todayOTMoney = 0; S.todayFocus = 0;
    S.clockInAt = null; S.clockInType = null; S.hasClockedOutToday = false;
    S._ot30 = false; S._ot60 = false; 
  }

  if (now % 60000 < 1000) checkEvents();

  if (S.clockInAt) {
    if (now - S.waterAt > S.waterInterval * 60000) { S.waterAt = now; say('喵～ 该喝水啦 💧', 3500); }
    if (now - S.sitAt > S.sitInterval * 60000) { S.sitAt = now; say('起来活动一下喵 🐾', 3500); }
    const [eh, em] = S.workEnd.split(':').map(Number);
    const endToday = new Date(); endToday.setHours(eh, em, 0, 0);
    const over = (now - endToday.getTime()) / 60000;
    if (over >= 60 && !S._ot60) { S._ot60 = true; say('已经加班 1 小时了喵…\n早点回家好不好', 4200); }
    else if (over >= 30 && !S._ot30) { S._ot30 = true; say('下班时间到啦喵！\n要打卡下班吗？', 3800); }
  } else { S._ot30 = false; S._ot60 = false; }
  refreshUI(); save();
}
setInterval(tick, 1000);

/* 钓鱼 */
function initFish() {
  gameBody.innerHTML = `
    <div class="fish-top"><div class="fish-bar-bg"><div id="fishBar"></div></div><div class="timer" id="fishTimer" style="font-size:12px;font-weight:700;color:#ffd166;">30s</div></div>
    <div class="fish-lane" id="fishLane"><div class="fish-target" id="fishTarget">🐟</div><div class="fish-hook" id="fishHook"></div></div>
    <div class="fish-hint" id="fishHint">按住 <b>屏幕/空格</b> 让绿块上升</div>`;
  const lane = $('fishLane'), fishEl = $('fishTarget'), hookEl = $('fishHook'), bar = $('fishBar'), timerEl = $('fishTimer'), hintEl = $('fishHint');
  let hookY = 0.5, hookV = 0, fishY = 0.3, fishTarget = 0.3, fishT = 0, progress = 35, timeLeft = 30, held = false;
  let last = performance.now(), raf = null, finished = false;
  const hookHalfHeight = 0.15, minY = hookHalfHeight + 0.02, maxY = 1 - hookHalfHeight - 0.02;
  const onDown = (e) => { if (e.target.closest && e.target.closest('button')) return; if (e.cancelable) e.preventDefault(); held = true; };
  const onUp = () => { held = false; };
  const onKeyDown = (e) => { if (e.code === 'Space') { e.preventDefault(); held = true; } };
  const onKeyUp = (e) => { if (e.code === 'Space') held = false; };
  gamePlayEl.addEventListener('pointerdown', onDown); window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp);
  window.addEventListener('keydown', onKeyDown); window.addEventListener('keyup', onKeyUp);
  function loop(now) {
    if (finished) return;
    const dt = Math.min((now - last) / 1000, 0.05); last = now; timeLeft -= dt;
    const targetV = held ? -0.85 : 0.85; hookV += (targetV - hookV) * Math.min(1, dt * 12);
    hookY += hookV * dt;
    if (hookY < minY) { hookY = minY; if (hookV < 0) hookV = 0; }
    if (hookY > maxY) { hookY = maxY; if (hookV > 0) hookV = 0; }
    fishT -= dt; if (fishT <= 0) { fishT = 0.45 + Math.random() * 1.1; fishTarget = 0.1 + Math.random() * 0.8; }
    fishY += (fishTarget - fishY) * Math.min(1, dt * 3);
    const inZone = Math.abs(hookY - fishY) < hookHalfHeight;
    progress += (inZone ? 24 : -16) * dt; progress = clamp(progress, 0, 100);
    hookEl.style.top = (hookY * 100) + '%'; fishEl.style.top = (fishY * 100) + '%'; bar.style.width = progress + '%';
    timerEl.textContent = Math.ceil(Math.max(0, timeLeft)) + 's'; lane.classList.toggle('in-zone', inZone);
    hintEl.innerHTML = inZone ? '<b style="color:#4ecca3">上钩啦！保持住～</b>' : '把绿块对准鱼儿';
    if (progress >= 100) { finishFish(true); return; }
    if (progress <= 0 || timeLeft <= 0) { finishFish(false); return; }
    raf = requestAnimationFrame(loop);
  }
  function finishFish(success) {
    if (finished) return; finished = true; cancelAnimationFrame(raf);
    let msg;
    if (success) {
      const reward = 10 + Math.floor(Math.random() * 10);
      S.coins += reward; S.mood = clamp(S.mood + 4, 0, 100); addExp(12);
      msg = `🐟 钓到啦！\n获得 ${reward} 💰`; say('哇！好大一条鱼喵～', 2600);
      for (let i = 0; i < 4; i++) setTimeout(spawnHeart, i * 100); showToast(`+${reward} 💰`);
    } else { S.mood = clamp(S.mood - 2, 0, 100); msg = '鱼儿跑掉了…\n下次加油喵'; }
    cooldowns.fish = Date.now() + GAMES.fish.cooldown; refreshUI(); save(); showResult(msg);
  }
  activeGame.cleanup = () => {
    finished = true; cancelAnimationFrame(raf);
    gamePlayEl.removeEventListener('pointerdown', onDown); window.removeEventListener('pointerup', onUp); window.removeEventListener('pointercancel', onUp);
    window.removeEventListener('keydown', onKeyDown); window.removeEventListener('keyup', onKeyUp);
  };
  last = performance.now(); raf = requestAnimationFrame(loop);
}

/* 接金币 */
function initCoin() {
  gameBody.innerHTML = `<div id="coinArena"><div class="coin-score" id="coinScore">0 💰</div></div>`;
  const arena = $('coinArena'), scoreEl = $('coinScore');
  let collected = 0, timeLeft = 12, finished = false;
  const timers = [];
  function updateTimer() { gameTimer.textContent = timeLeft + 's'; }
  updateTimer();
  timers.push(setInterval(() => {
    if (finished) return;
    const c = document.createElement('div'); c.className = 'falling-coin'; c.textContent = '💰';
    c.style.left = (8 + Math.random() * 80) + '%'; c.style.top = (12 + Math.random() * 72) + '%';
    c.addEventListener('pointerdown', (e) => {
      e.stopPropagation(); if (finished || c.dataset.got) return;
      if (e.cancelable) e.preventDefault(); c.dataset.got = '1'; collected++;
      scoreEl.textContent = collected + ' 💰';
      c.style.transition = 'transform .15s, opacity .15s'; c.style.transform = 'scale(1.6)'; c.style.opacity = '0';
      setTimeout(() => c.remove(), 160);
    });
    arena.appendChild(c); setTimeout(() => c.remove(), 1300);
  }, 380));
  timers.push(setInterval(() => { timeLeft--; updateTimer(); if (timeLeft <= 0) finishCoin(); }, 1000));
  function finishCoin() {
    if (finished) return; finished = true; timers.forEach(clearInterval);
    S.coins += collected; S.mood = clamp(S.mood + Math.min(10, collected), 0, 100); addExp(Math.floor(collected / 2));
    cooldowns.coin = Date.now() + GAMES.coin.cooldown; refreshUI(); save();
    say(collected > 10 ? '好厉害喵！接住好多！' : '接住了一些金币～', 2200);
    showResult(`接到 ${collected} 枚金币！\n+${collected} 💰`);
  }
  activeGame.cleanup = () => { finished = true; timers.forEach(clearInterval); };
}

/* 猜拳 */
function initRPS() {
  const opts = [{ k: 'rock', e: '✊', n: '石头' }, { k: 'scissors', e: '✌️', n: '剪刀' }, { k: 'paper', e: '🖐️', n: '布' }];
  const beats = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
  gameBody.innerHTML = `
    <div class="rps-wrap">
      <div class="rps-cat" id="rpsCat">🐱</div><div class="rps-text" id="rpsText">出拳吧！赢了拿金币喵</div>
      <div class="rps-btns">${opts.map(o => `<button class="rps-btn" data-k="${o.k}"><span>${o.e}</span><small>${o.n}</small></button>`).join('')}</div>
    </div>`;
  let finished = false, resultTimer = null;
  gameBody.querySelectorAll('.rps-btn').forEach(btn => {
    btn.onclick = () => {
      if (finished) return; finished = true;
      const player = btn.dataset.k, cat = opts[Math.floor(Math.random() * 3)].k;
      const catEl = $('rpsCat'), textEl = $('rpsText');
      catEl.textContent = opts.find(o => o.k === cat).e;
      let reward = 0, msg = '';
      if (player === cat) { reward = 3; msg = '平局！送你 3 💰'; }
      else if (beats[player] === cat) { reward = 10; msg = '你赢啦！+10 💰'; }
      else { msg = '我赢了喵～ 下次加油'; }
      if (reward) S.coins += reward;
      S.mood = clamp(S.mood + (reward ? 6 : 2), 0, 100); addExp(reward ? 8 : 3);
      textEl.textContent = msg; cooldowns.rps = Date.now() + GAMES.rps.cooldown;
      refreshUI(); save(); say(reward ? '你手气真好喵！' : '嘿嘿，我赢啦～', 2000);
      if (reward) showToast(`+${reward} 💰`);
      resultTimer = setTimeout(() => { if (!finished) return; showResult(msg); }, 950);
    };
  });
  activeGame.cleanup = () => { finished = true; clearTimeout(resultTimer); };
}

/* 启动 */
function boot() {
  refreshUI(); checkEvents();
  const hour = new Date().getHours();
  let greeting = '喵～今天也一起加油！';
  if (hour < 9) greeting = '早上好喵～ 新的一天！';
  else if (hour >= 18 && hour < 21) greeting = '下班时间到啦喵！';
  else if (hour >= 21) greeting = '这么晚了…注意休息喵 💤';
  setTimeout(() => say(greeting, 3000), 600);
}
boot();
</script>
